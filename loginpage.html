<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Karandeni Investment – Login</title>
  <link rel="stylesheet" href="loginpage.css" />
  <script src="config.js"></script>
</head>
<body>

  <div class="login-card">

    <!-- Logo area -->
    <div class="logo-area">
      <img src="logo.png" alt="Karandeni Investment Logo" style="max-height: 120px; width: auto; object-fit: contain; margin-bottom: 12px; border-radius: 8px;" />

      <!-- Company name text -->
      <div class="company-name">
        <span class="name-main">KARANDENI INVESTMENT</span>
        <span class="name-sub">INVESTMENTS & FINANCIAL SOLUTIONS</span>
      </div>
    </div>

    <!-- Sign In Now header -->
    <div class="signin-header">SIGN IN NOW</div>

    <!-- Form -->
    <div class="form-area">
      <div class="error-msg" id="errorMsg">Invalid username or password.</div>

      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      />

      <button class="btn-signin" onclick="handleLogin()">SIGN IN</button>
    </div>

  </div>

  <script>
    /* ══════════════════════════════════════════════════
       MACS MF – Real backend login via Python Flask API
       Backend URL is set in config.js
    ══════════════════════════════════════════════════ */

    function setLoading(isLoading) {
      const btn = document.querySelector('.btn-signin');
      btn.disabled = isLoading;
      btn.textContent = isLoading ? 'SIGNING IN...' : 'SIGN IN';
    }

    function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (!username || !password) {
        errorMsg.textContent = 'Please enter your username and password.';
        errorMsg.classList.add('show');
        return;
      }

      errorMsg.classList.remove('show');
      setLoading(true);

      fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      .then(r => r.json())
      .then(data => {
        setLoading(false);
        if (data.success) {
          /* Store JWT token and display name in sessionStorage */
          sessionStorage.setItem('authToken',    data.token);
          sessionStorage.setItem('loggedInUser', data.display_name);
          sessionStorage.setItem('userRole',     data.role || 'user');
          window.location.href = 'dashboard.html';
        } else {
          errorMsg.textContent = data.message || 'Invalid username or password.';
          errorMsg.classList.add('show');
        }
      })
      .catch(() => {
        setLoading(false);
        errorMsg.textContent = 'Cannot connect to server. Make sure the backend is running.';
        errorMsg.classList.add('show');
      });
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>

</body>
</html>
